# configs/model/dino_v3.yaml

name: "dino_v3"

# ViT backbone (timm)
architecture: "vit_small_patch16_224"

vit:
  image_size: 224
  patch_size: 16
  embed_dim: 384       # ViT-S/14 default
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  drop_path_rate: 0.1

dino:
  out_dim: 65536
  hidden_dim: 2048
  bottleneck_dim: 256
  nlayers: 3
  norm_last_layer: false

  # Temperatures
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30
  student_temp: 0.2

  # EMA teacher
  momentum_teacher: 0.996
  momentum_teacher_end: 1.0

  # Multi-crop parameters (needed by get_transforms)
  global_crops_scale: [0.4, 1.0]
  local_crops_scale: [0.05, 0.4]
  local_crops_number: 4